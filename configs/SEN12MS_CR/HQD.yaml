model:
  target: models.vqgan_v1.TCFVQGAN
  params:
    base_learning_rate: 3e-5
    image_key: "gt"
    ckpt_path:
    ddconfig:
      target: models.vqvae_arch.VQVAEGAN
      params:
        embed_dim: 512
        n_embed: 1024
        double_z: False
        z_channels: 512
        resolution: 256
        in_channels: 15
        out_ch: 13
        ch: 64
        ch_mult: [1, 2, 4, 6] # num_down = len(ch_mult)-1
        # ch: 64
        # ch_mult: [1, 2, 2, 4, 4, 8] # num_down = len(ch_mult)-1
        num_res_blocks: 2
        attn_resolutions: [32]
        dropout: 0.0
        enable_mid: True
        fix_decoder: False
        fix_codebook: False
        head_size: 4
        quantize_type: "ema"

    lossconfig:
      target: losses.loss.L1_SSIM_DW2A_Discriminator
      params:
        disc_conditional: False
        disc_in_channels: 13 # 15 + 13
        disc_start: 0
        disc_weight: 0.8
        codebook_weight: 1.0
        pixelloss_weight: 1.0
        addition_loss: ["2dwt", "ssim"]
        addition_loss_weight: [1., 0.]

data:
  target: main.PlDataModule
  params:
    train:
      batch_size: 1
      num_workers: 8
      target: data.datasets.SEN12MS_CR
      params:
        path: PATH_TO_DATASET/SEN12MS-CR-5K/train
        aug: True
        for_codebook: True

    val:
      batch_size: 1
      num_workers: 8
      target: data.datasets.SEN12MS_CR
      params:
        path: PATH_TO_DATASET/SEN12MS-CR-5K/val
        aug: False
        for_codebook: True

    test:
      batch_size: 1
      num_workers: 8
      target: data.datasets.SEN12MS_CR
      params:
        path: PATH_TO_DATASET/SEN12MS-CR-5K/test
        aug: False
        for_codebook: True

logger:
  target: pytorch_lightning.loggers.TensorBoardLogger
  params:
    save_dir: logs/sen12ms_cr
    name: HQD

lightning:
  trainer:
    max_epochs: 100
    accelerator: "gpu"
    devices: 1
    enable_progress_bar: true
